[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quickhash"
version = "1.1.0"
description = "算文件哈希、生成和校验校验文件，格式兼容 sha256sum"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Liuyichen27" }]
keywords = ["hash", "sha256", "md5", "checksum", "cli", "verify"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Liuyichen27/quickhash"

[project.scripts]
quickhash = "quickhash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
